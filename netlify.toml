# Sitio estático: no hay que compilar nada, se publica la carpeta tal cual.
[build]
  publish = "."
  command = ""

# Que el teléfono siempre reciba la versión nueva de la app.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Las pruebas automáticas no se publican: borran el almacenamiento local al ejecutarse.
[[redirects]]
  from = "/pruebas/*"
  to = "/index.html"
  status = 404
  force = true
