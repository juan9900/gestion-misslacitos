<!doctype html><meta charset="utf-8"><title>Pruebas Miss Lacitoss</title>
<body style="margin:0;background:#333;color:#eee;font:14px monospace;display:flex;gap:12px;padding:8px">
<iframe id="f" style="width:390px;height:700px;border:0;background:#111"></iframe>
<pre id="out" style="flex:1;white-space:pre-wrap;margin:0"></pre>
<script>
const fr=document.getElementById('f');let w,d;
const RES=[];window.RES=RES;window.FIN=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const log=t=>{document.getElementById('out').textContent+=t+'\n'};
function ok(nombre,cond,extra){RES.push({ok:!!cond,nombre,extra:cond?undefined:extra});log((cond?'OK   ':'FALLA ')+nombre+(cond?'':'  -> '+JSON.stringify(extra)))}
const srv=()=>JSON.parse(localStorage.getItem('FAKE_SERVER')||'{"rows":{},"clock":0,"reject":[],"down":false}');
const setSrv=f=>{const s=srv();f(s);localStorage.setItem('FAKE_SERVER',JSON.stringify(s))};
const APP=['negocio','negocio_nube','ml-sesion','negocio_antes_de_nube','negocio_antes_de_recuperar','negocio_v1_respaldo'];
let actual='A';
function guardarTel(n){const o={};APP.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)o[k]=v});localStorage.setItem('TEL_'+n,JSON.stringify(o))}
function cargarTel(n){APP.forEach(k=>localStorage.removeItem(k));const o=JSON.parse(localStorage.getItem('TEL_'+n)||'{}');for(const k in o)localStorage.setItem(k,o[k])}
async function abrir(){await new Promise(r=>{fr.onload=r;fr.src='index.html?'+Date.now()});w=fr.contentWindow;d=w.document;await wait(500)}
async function telefono(n){guardarTel(actual);cargarTel(n);actual=n;await abrir()}
const E=c=>w.eval(c);
const q=s=>d.querySelector(s);
const clic=s=>{const el=typeof s=='string'?q(s):s;if(!el)throw new Error('no existe '+s);el.dispatchEvent(new w.MouseEvent('click',{bubbles:true}))};
const pon=(s,v)=>{const el=q(s);if(!el)throw new Error('no existe '+s);el.value=v;el.dispatchEvent(new w.Event('input',{bubbles:true}))};
const enviar=()=>q('#sf').requestSubmit();
const errTxt=()=>(q('#sf-err')||{}).textContent||'';
const hojaAbierta=()=>!q('#ov').hidden;
async function entrar(email='a@p.com'){pon('#login-f [name=email]',email);pon('#login-f [name=clave]','ok');q('#login-f').requestSubmit();await wait(500)}
async function sync(){await E('subir()');await E('bajar()');await wait(50)}
const filas=(col)=>Object.values(srv().rows).filter(r=>r.coleccion==col);

async function T(nombre,fn){try{await fn()}catch(e){ok(nombre+' (excepción)',false,String(e&&e.stack||e))}}

(async()=>{
 /* Seguro: estas pruebas BORRAN el almacenamiento local. Solo corren en la computadora, nunca en el sitio real. */
 if(!['127.0.0.1','localhost'].includes(location.hostname)){log('Las pruebas solo se ejecutan en 127.0.0.1');return}
 /* un service worker de otra copia podría servir archivos viejos: se quita y se recarga */
 if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();
  for(const k of await caches.keys())await caches.delete(k);
  if(navigator.serviceWorker.controller&&!sessionStorage.getItem('swLimpio')){sessionStorage.setItem('swLimpio','1');location.reload();return}}
 sessionStorage.removeItem('swLimpio');
 Object.keys(localStorage).forEach(k=>localStorage.removeItem(k));
 await abrir();

  ok('1b contraseña mala da mensaje claro',/no coinciden/.test(q('#login-err').textContent),q('#login-err').textContent);
  await entrar();
  ok('1c entra y queda enlazado',q('#login').hidden&&E('enNube()'),{login:q('#login').hidden});
 });

  E('A.nuevoPedido()');pon('#pf-nom','María Pérez');clic('#pf-res [data-a=pfCliSel]');clic('#pf-prods [data-a=pfAdd]');clic('[data-a=pfMas]');

  const copia={v:2,productos:[],clientas:[{id:'vieja',nombre:'Clienta de la copia',tel:'',dir:'',ig:'',notas:''}],pedidos:[],movs:[],compras:[],cats:['Lazos'],copiaAt:''};

  ok('7a avisa que se agrega',/agrega/.test(q('#sheet-b').textContent),q('#sheet-b').textContent.slice(0,200));

  ok('7c nada quedó borrado en la nube por la copia',filas('pedidos').every(r=>!r.borrado)&&filas('clientas').filter(r=>!r.borrado).length==antes+1,filas('clientas').map(r=>r.id+':'+r.borrado));
 });
