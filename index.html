<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131015">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Miss Lacitoss">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Miss Lacitoss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Fraunces:opsz,wght,SOFT@9..144,500..800,0..100&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Miss Lacitoss — estilo «taller de noche»
   Negro del logo · letras caramelo en pastel · puntadas de costura
   ========================================================= */
:root{
 color-scheme:dark;
 --bg:#131015;--card:#1d1820;--card2:#272129;--hondo:#100d12;--line:#342c39;--line2:#463c4c;
 --ink:#fbf3ea;--muted:#a99fad;--tinta:#1b1419;
 --rosa:#ff8fc4;--durazno:#ffb47e;--limon:#ffe27d;--menta:#88e3a7;--cielo:#80d4ea;--lila:#bba5ff;--coral:#ff8b85;
 --fd:'Fraunces',Georgia,serif;--fb:'Figtree',system-ui,-apple-system,sans-serif;
 --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:600 17px/1.4 var(--fb);padding-bottom:calc(92px + env(safe-area-inset-bottom));overscroll-behavior-y:none;
 background:
  radial-gradient(70% 45% at 105% -5%,rgba(255,143,196,.13),transparent 70%),
  radial-gradient(55% 40% at -10% 35%,rgba(128,212,234,.07),transparent 70%),
  radial-gradient(60% 40% at 50% 110%,rgba(187,165,255,.08),transparent 70%),
  var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
 background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:22px 22px;
 -webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.d{font-family:var(--fd);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:650;letter-spacing:-.01em}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:18px;height:18px}.i.l{width:28px;height:28px}

/* ---------- puntada de costura (firma visual) ---------- */
.puntada{height:3px;border:0;margin:0;
 background:linear-gradient(90deg,var(--rosa),var(--durazno),var(--limon),var(--menta),var(--cielo),var(--lila));
 -webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 15px);mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 15px)}

/* ---------- cabecera ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 0;
 background:linear-gradient(var(--bg) 70%,rgba(19,16,21,.0));}
.cab{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-bottom:10px}
.logo{flex:none;width:52px;height:52px;border-radius:50%;padding:3px;border:1.5px dashed rgba(251,243,234,.45)}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
.cab h1{margin:0;font-size:26px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab>div:last-child{min-width:0}
.cab small{display:block;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
header .puntada{max-width:640px;margin:0 auto}

main{max-width:640px;margin:0 auto;padding:16px 16px 8px}
main section>*{animation:entra .42s cubic-bezier(.2,.7,.2,1) both}
main section>*:nth-child(2){animation-delay:.04s}main section>*:nth-child(3){animation-delay:.08s}
main section>*:nth-child(4){animation-delay:.12s}main section>*:nth-child(5){animation-delay:.16s}main section>*:nth-child(n+6){animation-delay:.2s}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tit{display:flex;align-items:center;gap:10px;margin:28px 2px 12px;font-size:22px}
.tit::after{content:"";flex:1;height:0;border-top:2px dashed var(--line2);margin-left:4px}
.tit .n{font-family:var(--fb);font-size:13px;font-weight:800;color:var(--tinta);background:var(--muted);border-radius:20px;padding:2px 9px}
.sm{color:var(--muted);font-size:15px;font-weight:600}
.vacio{text-align:center;color:var(--muted);padding:26px 16px;border-radius:var(--r);border:2px dashed var(--line);font-weight:600}
.vacio .i{display:block;margin:0 auto 8px;width:30px;height:30px;color:var(--line2)}

/* ---------- caramelos (botones de color) ---------- */
.caramelo{position:relative;border:0;color:var(--tinta);border-radius:22px;
 box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 10px 24px -14px var(--c,var(--rosa));background:var(--c,var(--rosa))}
.caramelo::after{content:"";position:absolute;inset:5px;border-radius:17px;border:1.5px dashed rgba(27,20,25,.28);pointer-events:none}
.caramelo:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.c-rosa{--c:var(--rosa)}.c-menta{--c:var(--menta)}.c-coral{--c:var(--coral)}.c-lila{--c:var(--lila)}.c-limon{--c:var(--limon)}.c-cielo{--c:var(--cielo)}.c-durazno{--c:var(--durazno)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:128px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.tile .ico{width:44px;height:44px;border-radius:14px;background:rgba(27,20,25,.12);display:flex;align-items:center;justify-content:center}
.tile b{font-family:var(--fd);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:700;font-size:21px;line-height:1.05;letter-spacing:-.01em}
.tile.chico{min-height:96px;padding:12px}
.tile.chico b{font-size:18px}
.tile.chico .ico{width:36px;height:36px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 18px;margin:10px 0;font-weight:800;font-size:17px;text-align:center}
.btn.caramelo::after{inset:4px;border-radius:18px}
.btn.plano{border:1.5px solid var(--line2);background:var(--card);color:var(--ink);border-radius:18px}
.btn.plano:active{background:var(--card2)}
.btn.wa{--c:#5fdc8f}

/* ---------- tarjetas ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
button.card{display:block;width:100%;text-align:left;color:inherit;font:inherit}
button.card:active{background:var(--card2)}
.fila{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.nm{font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.tag{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;padding:5px 11px;border-radius:30px;white-space:nowrap;
 color:var(--t,var(--muted));background:color-mix(in srgb,var(--t,var(--muted)) 16%,transparent)}
.t-rosa{--t:var(--rosa)}.t-menta{--t:var(--menta)}.t-coral{--t:var(--coral)}.t-lila{--t:var(--lila)}.t-limon{--t:var(--limon)}.t-durazno{--t:var(--durazno)}.t-cielo{--t:var(--cielo)}
.k-menta{color:var(--menta)}.k-coral{color:var(--coral)}.k-lila{color:var(--lila)}.k-rosa{color:var(--rosa)}.k-limon{color:var(--limon)}

/* resumen del mes (inicio) */
.hero{padding:20px;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:2px dashed rgba(255,143,196,.25)}
.hero .et{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hero .big{font-size:46px;line-height:1;margin:6px 0 16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo>div{background:var(--hondo);border-radius:16px;padding:12px 14px;min-width:0}
.duo small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:800}
.duo b{display:block;font-size:22px;margin-top:2px;overflow-wrap:anywhere}
.punto{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.link{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;padding:12px 2px 0;border:0;border-top:1.5px dashed var(--line2);background:none;color:var(--rosa);font-weight:800;font-size:16px}

.deben{border-color:color-mix(in srgb,var(--coral) 40%,var(--line))}
.deben .big{font-size:36px;color:var(--coral);line-height:1.1}

.saludo{font-size:32px;line-height:1.1;margin:6px 2px 4px}
.fecha{margin:0 2px 18px;color:var(--muted);font-weight:600}
.fecha::first-letter{text-transform:uppercase}
.aviso{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--limon) 12%,var(--card));border:1px solid color-mix(in srgb,var(--limon) 35%,transparent);border-radius:var(--r);padding:16px;margin-bottom:16px;color:var(--limon)}
.aviso p{margin:0;color:var(--ink);font-weight:600}
.aviso .btn{min-height:48px;margin:12px 0 0;font-size:16px}

/* ---------- pedidos ---------- */
.ped::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--t,var(--durazno))}
.its{list-style:none;margin:12px 0 8px;padding:0}
.its li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.its li:last-child{border-bottom:0}
.its li span:last-child{flex:none;color:var(--muted)}
.det{display:flex;gap:8px;align-items:flex-start;background:var(--hondo);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px;overflow-wrap:anywhere;color:#e6dce4}
.det .i{color:var(--muted);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin-top:6px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.cuenta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line2)}
.cuenta .sm b{color:var(--ink)}
.cuenta .saldo{font-size:24px;line-height:1;text-align:right}
.cuenta .saldo small{display:block;font-family:var(--fb);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;margin-bottom:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mini{flex:1 1 auto;min-height:48px;padding:8px 14px;border:1.5px solid var(--line2);border-radius:14px;background:var(--card2);color:var(--ink);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.mini:active{transform:scale(.97)}
.mini.caramelo{border:0}
.mini.caramelo::after{inset:3px;border-radius:11px}
.mini.ico{flex:0 0 auto;width:48px;padding:0}
.mini.borrar{color:var(--coral)}

/* ---------- filtros / búsqueda ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:8px 15px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);border-radius:30px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip small{font-weight:800;color:var(--muted)}
.chip.on{background:var(--rosa);border-color:var(--rosa);color:var(--tinta)}
.chip.on small{color:rgba(27,20,25,.6)}
.chip.add{border-style:dashed;color:var(--muted)}
.scroll{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:none}
.buscar{position:relative;margin:12px 0 2px}
.buscar .i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.buscar input{width:100%;min-height:54px;padding:12px 16px 12px 48px;border:1.5px solid var(--line);border-radius:18px;background:var(--hondo);font-size:17px;font-weight:600}
.buscar input:focus{outline:0;border-color:var(--rosa)}
.buscar input::placeholder,.in::placeholder,.din input::placeholder{color:#6f6574}

/* ---------- números ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;min-width:0}
.kpi small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:800}
.kpi b{display:block;font-size:24px;margin-top:4px;overflow-wrap:anywhere}
.kpi.full{grid-column:1/-1}
.kpi.estrella{background:var(--hondo);border-style:dashed;border-color:var(--line2)}
.kpi.estrella b{font-size:34px}
.bar{background:var(--hondo);border-radius:10px;height:10px;margin:7px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--rosa),var(--lila))}
.mes{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 4px;padding:6px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.mes b{font-size:22px;text-align:center;flex:1}
.mes b::first-letter{text-transform:uppercase}
.mes button{width:48px;height:48px;border:0;border-radius:15px;background:var(--card2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.mes button:disabled{opacity:.25}
.expl{font-size:14px;color:var(--muted);border-left:3px solid var(--line2);padding:4px 0 4px 12px;margin:12px 0 4px;font-weight:600}
.expl b{color:var(--ink)}

/* ---------- movimientos ---------- */
.mov{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0}
.mov:active{background:var(--card2)}
.mov .ic{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--t);background:color-mix(in srgb,var(--t) 15%,transparent)}
.mov .tx{flex:1;min-width:0}
.mov .tx b{display:block;overflow-wrap:anywhere;font-weight:700}
.mov .mt{flex:none;font-size:19px;color:var(--t)}
.ing{--t:var(--menta)}.egr{--t:var(--coral)}.inv{--t:var(--lila)}

/* ---------- inventario ---------- */
.prod.bajo::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--coral)}
.precio{font-size:20px}
.stock{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--hondo);border-radius:18px;padding:8px}
.stock b{min-width:44px;text-align:center;font-size:28px;line-height:1}
.stock .lbl{flex:1;font-size:14px;color:var(--muted)}
.redondo{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card2);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.redondo.mas{background:var(--rosa);border-color:var(--rosa);color:var(--tinta)}
.redondo:active{transform:scale(.94)}

/* ---------- hoja inferior (formularios) ---------- */
#ov{position:fixed;inset:0;z-index:50;background:rgba(8,6,10,.7);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:#1a151d;border:1px solid var(--line);border-bottom:0;width:100%;max-width:640px;max-height:calc(100% - 20px - env(safe-area-inset-top));overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:sube .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
#sheet .agarre{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:2px auto 14px}
#sheet h3{font-size:26px;line-height:1.1;margin:0 0 4px}
.f{display:block;margin:20px 0 0}
.f>span{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:17px}
.f>span .paso{flex:none;font-style:normal;font-family:var(--fd);font-variation-settings:"SOFT" 100;width:26px;height:26px;border-radius:50%;background:var(--rosa);color:var(--tinta);font-size:15px;display:inline-flex;align-items:center;justify-content:center;transform:translateY(3px)}
.f>span em{font-style:normal;color:var(--muted);font-weight:600;font-size:14px}
.f>small{display:block;color:var(--muted);font-size:14px;margin-top:3px;font-weight:600}
.in{width:100%;min-height:56px;padding:12px 16px;font-size:18px;font-weight:600;border:1.5px solid var(--line2);border-radius:16px;background:var(--hondo);margin-top:8px;-webkit-appearance:none;appearance:none}
textarea.in{min-height:84px;resize:vertical;line-height:1.35}
.in:focus,.din:focus-within{outline:0;border-color:var(--rosa);box-shadow:0 0 0 4px rgba(255,143,196,.14)}
input[type=date].in{min-height:56px}
.din{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:16px;background:var(--hondo);margin-top:8px;overflow:hidden}
.din>b{padding:0 2px 0 16px;font-size:22px;color:var(--muted);font-family:var(--fd)}
.din input{flex:1;min-width:0;border:0;min-height:54px;font-size:22px;font-weight:800;padding:10px 14px 10px 6px;background:transparent}
.din input:focus{outline:0}
.eco{display:block;font-style:normal;font-size:14px;color:var(--menta);font-weight:800;min-height:19px;margin-top:4px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px}
.item .row2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:32px;text-align:center;font-size:22px}
.item .din{flex:1;min-width:130px;margin-top:0}
.item .din input{font-size:19px;min-height:48px}
.item .pie{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:8px;font-size:14px;color:var(--muted)}
.item .pie .eco{margin:0;min-height:0}
.item .pie b{color:var(--ink)}
.quitar{border:0;background:color-mix(in srgb,var(--coral) 15%,transparent);color:var(--coral);width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.total{display:flex;justify-content:space-between;align-items:center;border:1.5px dashed var(--line2);border-radius:18px;padding:14px 18px;margin-top:14px}
.total span{font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-size:14px}
.total b{font-size:30px;line-height:1}
.sel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--rosa) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--rosa) 40%,transparent);border-radius:18px;padding:12px 14px;margin-top:8px}
.sel b{overflow-wrap:anywhere}
.res button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-top:6px;font-weight:700;color:var(--ink)}
.res button small{display:block;color:var(--muted);font-weight:600}
.opciones{display:grid;gap:8px;margin-top:10px}
.opcion{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 16px;border:1.5px solid var(--line2);border-radius:18px;background:var(--card);color:var(--ink);font-weight:800;text-align:left}
.opcion .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opcion .sm{display:block;font-size:14px}
.opcion.on{border-color:var(--rosa);background:color-mix(in srgb,var(--rosa) 10%,var(--card))}
.opcion.on .ico{background:var(--rosa);color:var(--tinta)}
.err{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral);font-weight:800;border-radius:14px;padding:12px 14px;margin-top:16px}
.nota{display:flex;gap:10px;align-items:flex-start;background:var(--hondo);border-radius:16px;padding:12px 14px;margin:6px 0 0;color:var(--muted);font-size:15px;font-weight:600}
.nota .i{color:var(--lila);margin-top:1px}
.nota b{color:var(--ink)}

/* ---------- menú inferior ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav .barra{pointer-events:auto;display:flex;gap:2px;max-width:560px;margin:0 auto;padding:6px;border-radius:26px;background:rgba(16,13,18,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 40px -10px rgba(0,0,0,.7)}
nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:20px;padding:8px 2px 7px;font-size:11.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,color .2s}
nav button .i{width:24px;height:24px}
nav button.on{background:var(--rosa);color:var(--tinta)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--tinta);border-radius:18px;padding:14px 16px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:opacity .25s,transform .25s}
#toast .i{color:#1f9d5a}
#toast.oculto{opacity:0;transform:translateY(16px);pointer-events:none}
#toast.malo{background:var(--coral)}
#toast.malo .i{color:var(--tinta)}

.instalar{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px;margin:26px 2px 8px;font-weight:600}

/* ---------- nube ---------- */
.nube{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:30px;border:1.5px solid var(--line2);background:var(--card);color:var(--t,var(--muted));font-weight:800;font-size:13px}
.nube .i{width:20px;height:20px}
.nube.ok{--t:var(--menta)}.nube.pend{--t:var(--limon)}.nube.mal{--t:var(--coral)}
.estado{display:flex;gap:12px;align-items:center}
.estado .ic{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--t);background:color-mix(in srgb,var(--t) 15%,transparent)}
#login{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
#login .caja{width:100%;max-width:400px;text-align:center}
#login .logo{width:120px;height:120px;margin:0 auto 18px;padding:5px;border-width:2px}
#login h2{font-size:32px;margin:0 0 6px}
#login form{text-align:left;margin-top:18px}
.reps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rep{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:112px;padding:14px;border-radius:20px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);text-align:left;font-weight:800;font-size:15px;line-height:1.2}
.rep .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tinta);background:var(--c)}
.rep small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:3px}
.rep:active{background:var(--card2)}

@media (min-width:560px){
 .tiles{grid-template-columns:repeat(4,1fr)}
 .tiles.tres{grid-template-columns:repeat(3,1fr)}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .kpis .kpi.full{grid-column:span 2}
}
@media (max-width:350px){
 body{font-size:16px}
 nav button{font-size:10.5px}
 .tile b{font-size:18px}
 .hero .big{font-size:38px}
}

</style>
</head>

};

 egr:{t:'Gasté dinero',q:'¿En qué lo gastaste?',ph:'Ej: delivery a Los Olivos',ic:'sale',c:'c-coral',signo:'−',cats:['Delivery / envío','Pasaje','Publicidad','Empaques','Otro'],
  ayuda:'Gastos del día a día que no se quedan en el negocio: envíos, pasajes, publicidad, empaques.'},
 inv:{t:'Invertí en el negocio',q:'¿En qué invertiste?',ph:'Ej: 10 metros de cinta rosada',ic:'brote',c:'c-lila',signo:'−',cats:['Materiales','Cintas e hilos','Mercancía','Herramientas','Máquina','Otro'],
  ayuda:'Inversión es lo que compras para fabricar o hacer crecer el negocio: materiales, mercancía, herramientas, máquinas.'}
};

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const isoDe=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>isoDe(new Date());
const mesDe=iso=>String(iso||'').slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fe=iso=>{if(!iso)return'';const[a,m,d]=iso.split('-');return d+'/'+m+'/'+a};
const nombreMes=k=>{const[a,m]=k.split('-');return MESES[+m-1]+' '+a};
const diasHasta=iso=>{const[a,m,d]=iso.split('-').map(Number);const t=new Date(a,m-1,d),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)};
const sum=(arr,f)=>arr.reduce((a,x)=>a+(f(x)||0),0);
const plural=(n,a,b)=>n+' '+(n==1?a:b);

function fmt(c){c=Math.round(c||0);const n=Math.abs(c)/100;
 const s=n.toFixed(2).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
 return (c<0?'-':'')+'$'+s[0]+','+s[1]}
/* Acepta 2,50 · 2.50 · 1.250,50 · 1,250.50 · 15 → centavos */
function aCent(v){let s=String(v??'').trim().replace(/[^\d.,]/g,'');if(!s)return 0;
 const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
 if(lc>-1&&ld>-1){const dec=lc>ld?',':'.',mil=dec==','?'.':',';s=s.split(mil).join('').replace(dec,'.')}
 else if(lc>-1){s=s.split(',').length>2?s.split(',').join(''):s.replace(',','.')}
 else if(ld>-1&&s.split('.').length>2){s=s.split('.').join('')}
 const n=parseFloat(s);return isFinite(n)&&n>0?Math.round(n*100):0}
const centInput=c=>c?(c/100).toFixed(2).replace('.',','):'';
const numViejo=v=>Math.round((parseFloat(String(v??0).replace(',','.'))||0)*100);
function telWa(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';
 if(d.startsWith('00'))d=d.slice(2);
 if(d.length==11&&d[0]=='0')d='58'+d.slice(1);
 else if(d.length==10&&d[0]=='4')d='58'+d;
 return d}

/* ---------- datos ---------- */
let D;
function vacio(){return{v:2,productos:[],clientas:[],pedidos:[],movs:[],cats:[...CATS],copiaAt:''}}
function migrar(o){
 if(!o||typeof o!=='object')return vacio();
 if(o.v===2){const n=vacio();for(const k in n)if(o[k]===undefined)o[k]=n[k];return o}
 /* formato viejo: {p:[pedidos], c:[movimientos], tipos:[...]} */
 const n=vacio();
 const fechaDeId=id=>{const t=+id;return t>1e12&&t<4e12?isoDe(new Date(t)):hoy()};
 (o.tipos||[]).forEach(t=>{t=String(t||'').trim();if(t&&!n.cats.some(c=>c.toLowerCase()==t.toLowerCase()))n.cats.push(t)});
 const cl={};
 (o.p||[]).forEach(p=>{
  const nom=String(p.cliente||'').trim()||'Sin nombre',k=nom.toLowerCase();
  if(!cl[k]){cl[k]={id:uid(),nombre:nom,tel:'',dir:'',ig:'',notas:''};n.clientas.push(cl[k])}
  const cant=Math.max(1,parseInt(p.cant)||1),tot=numViejo(p.precio);
  n.pedidos.push({id:String(p.id||uid()),clienteId:cl[k].id,items:[{pid:'',nombre:p.tipo||'Otro',cant,precio:Math.round(tot/cant)}],
   total:tot,pagoPrevio:numViejo(p.abono),detalle:p.detalle||'',entrega:p.entrega||'',entregado:!!p.ok,fecha:fechaDeId(p.id)});
 });
 (o.c||[]).forEach(m=>n.movs.push({id:String(m.id||uid()),tipo:m.tipo=='egr'?'egr':'ing',concepto:m.concepto||'',cat:m.prod||'',
  monto:numViejo(m.monto),fecha:fechaDeId(m.id),pedidoId:''}));
 return n}
function cargar(){
 let raw=null,o=null;
 try{raw=localStorage.getItem(KEY)}catch(e){}
 try{o=raw?JSON.parse(raw):null}catch(e){o=null}
 const viejo=o&&o.v!==2;
 if(viejo){try{localStorage.setItem(KEY+'_v1_respaldo',raw)}catch(e){}}
 D=migrar(o);
 if(viejo)guardar(true);
}
function guardar(silencio){
 try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){aviso('No se pudo guardar. Revisa el espacio del teléfono.',true)}
 marcarCambios();
 if(!silencio)pintar();
}
const cli=id=>D.clientas.find(c=>c.id==id);
const prod=id=>D.productos.find(p=>p.id==id);
const ped=id=>D.pedidos.find(p=>p.id==id);
const pagado=p=>(p.pagoPrevio||0)+sum(D.movs.filter(m=>m.pedidoId==p.id&&m.tipo=='ing'),m=>m.monto);
const debe=p=>Math.max(0,p.total-pagado(p));
const nomCli=p=>{const c=cli(p.clienteId);return c?c.nombre:'Venta rápida'};
const unidades=p=>sum(p.items,i=>i.cant);
function moverStock(items,signo){items.forEach(i=>{const pr=i.pid&&prod(i.pid);if(pr&&!pr.encargo)pr.stock=(pr.stock||0)+signo*i.cant})}

/* ---------- avisos ---------- */
let tAviso;
function aviso(txt,malo){const t=$('#toast');t.innerHTML=ic(malo?'alerta':'check')+'<span>'+esc(txt)+'</span>';t.classList.toggle('malo',!!malo);t.classList.remove('oculto');
 clearTimeout(tAviso);tAviso=setTimeout(()=>t.classList.add('oculto'),malo?4200:2600)}

/* ---------- hoja inferior (formularios) ---------- */
let alGuardar=null;
function hoja(titulo,html,{ok='Guardar',c='c-menta',onOk,sinBoton}={}){

  <button class="btn plano" type="button" data-a="cerrar">${sinBoton?'Cerrar':'Cancelar'}</button></form>`;
 alGuardar=onOk||null;$('#ov').hidden=false;document.body.classList.add('lock');$('#sheet').scrollTop=0;
}
function cerrar(){$('#ov').hidden=true;document.body.classList.remove('lock');$('#sheet-b').innerHTML='';alGuardar=null}
function error(txt){$('#sf-err').innerHTML=`<div class="err">${ic('alerta')}<span>${esc(txt)}</span></div>`;$('#sf-err').scrollIntoView({block:'center',behavior:'smooth'});return false}
function preguntar(txt,ok,fn,c='c-coral'){hoja('¿Estás segura?',`<p style="font-size:18px;margin:8px 0 0;font-weight:600;line-height:1.5">${txt}</p>`,{ok,c,onOk:()=>{fn();return true}})}
$('#sheet-b').addEventListener('submit',e=>{e.preventDefault();if(!alGuardar)return cerrar();if(alGuardar(new FormData(e.target),e.target)!==false)cerrar()});

document.addEventListener('input',e=>{const i=e.target;
 if(i.matches('label [data-din]')){const eco=i.closest('label').querySelector('.eco');if(eco)eco.textContent=i.value.trim()?'= '+fmt(aCent(i.value)):''}
});
const opc=t=>` <em>(opcional)</em>`;
const paso=(n,t,extra='')=>`<span>${n?`<i class="paso">${n}</i>`:''}${t}${extra}</span>`;
const campoDinero=(name,n,label,val,help)=>`<label class="f">${paso(n,label)}${help?`<small>${help}</small>`:''}

/* ---------- números de un mes ---------- */
function corte(k){
 const M=D.movs.filter(m=>mesDe(m.fecha)==k),P=D.pedidos.filter(p=>mesDe(p.fecha)==k);
 const t=tp=>sum(M.filter(m=>m.tipo==tp),m=>m.monto);
 const I=t('ing'),E=t('egr'),V=t('inv');
 return{M,P,I,E,V,G:I-E-V,ventas:sum(P,p=>p.total),uds:sum(P,unidades),debenMes:sum(P,debe)}}
const deudaTotal=()=>sum(D.pedidos,debe);

/* ---------- INICIO ---------- */
function pInicio(){
 const n=new Date(),c=corte(mesDe(hoy())),deudoras=D.pedidos.filter(p=>debe(p)>0);
 const pend=D.pedidos.filter(p=>!p.entregado).sort((a,b)=>(a.entrega||'9').localeCompare(b.entrega||'9'));
 const bajos=D.productos.filter(p=>!p.encargo&&(p.stock||0)<=(p.minimo??2));
 const hayDatos=D.pedidos.length+D.movs.length+D.productos.length>0;
 const diasCopia=D.copiaAt?-diasHasta(D.copiaAt):999;
 const hora=n.getHours(),saludo=hora<12?'¡Buenos días!':hora<19?'¡Buenas tardes!':'¡Buenas noches!';
 $('#pg-inicio').innerHTML=`
 ${hayDatos&&diasCopia>=7&&!enNube()?`<div class="aviso">${ic('alerta')}<div style="flex:1"><p>${D.copiaAt?`Tu última copia de seguridad fue hace ${diasCopia} días.`:'Todavía no has guardado una copia de seguridad.'} Guárdala para no perder nada si se daña el teléfono.</p>
  <button class="btn caramelo c-limon" data-a="exportar">${ic('bajar')}Guardar copia ahora</button></div></div>`:''}
 <div><div class="saludo d">${saludo}</div><p class="fecha">${DIAS[n.getDay()]} ${n.getDate()} de ${MESES[n.getMonth()]}</p></div>
 <div class="tiles">
  <button class="tile caramelo c-rosa" data-a="nuevoPedido"><span class="ico">${ic('bolsa','l')}</span><b>Anotar pedido o venta</b></button>
  <button class="tile caramelo c-menta" data-a="mov" data-id="ing"><span class="ico">${ic('entra','l')}</span><b>Me entró dinero</b></button>
  <button class="tile caramelo c-coral" data-a="mov" data-id="egr"><span class="ico">${ic('sale','l')}</span><b>Gasté dinero</b></button>
  <button class="tile caramelo c-lila" data-a="mov" data-id="inv"><span class="ico">${ic('brote','l')}</span><b>Invertí en el negocio</b></button>
 </div>
 <div class="card hero" style="margin-top:16px">
  <div class="et">Me quedó en ${MESES[n.getMonth()]}</div>
  <div class="big d ${c.G<0?'k-coral':''}">${fmt(c.G)}</div>
  <div class="duo">
   <div><small><i class="punto k-menta"></i>Entró</small><b class="d k-menta">${fmt(c.I)}</b></div>
   <div><small><i class="punto k-coral"></i>Salió</small><b class="d k-coral">${fmt(c.E+c.V)}</b></div>
  </div>
  <button class="link" data-a="tab" data-id="dinero">Ver el corte del mes ${ic('der')}</button>

function entregaTag(iso){const d=diasHasta(iso);
 if(d<0)return`<span class="tag t-coral">${ic('reloj','s')}Atrasado ${plural(-d,'día','días')}</span>`;
 if(d==0)return`<span class="tag t-coral">${ic('reloj','s')}Es hoy</span>`;
 if(d==1)return`<span class="tag t-limon">${ic('reloj','s')}Mañana</span>`;
 if(d<=3)return`<span class="tag t-limon">${ic('reloj','s')}En ${d} días</span>`;
 return`<span class="tag">${ic('cal','s')}${fe(iso).slice(0,5)}</span>`}
function instalarTxt(){
 if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return'';
 return`<p class="instalar">${ic('info')}<span>${/iphone|ipad/i.test(navigator.userAgent)

function guardarPedido(fd){
 const detalle=String(fd.get('detalle')||'').trim(),entrega=String(fd.get('entrega')||'');
 F.items=F.items.map(i=>({...i,nombre:String(i.nombre||'').trim()}));
 if(!F.items.length)return error('Toca al menos un producto en el paso 2.');
 if(F.items.some(i=>!i.nombre))return error('Escribe el nombre del producto que falta.');
 if(F.items.some(i=>!i.precio))return error('Ponle precio a todos los productos.');
 const total=sum(F.items,i=>i.precio*i.cant);
 let clienteId=F.clienteId;
 if(!clienteId&&F.nombre.trim()){const nom=F.nombre.trim(),ex=D.clientas.find(c=>c.nombre.trim().toLowerCase()==nom.toLowerCase());
  if(ex)clienteId=ex.id;else{const c={id:uid(),nombre:nom,tel:F.tel.trim(),dir:'',ig:'',notas:''};D.clientas.push(c);clienteId=c.id}}
 if(F.viejo){const p=F.viejo;moverStock(p.items,+1);Object.assign(p,{clienteId,items:F.items,total,detalle,entrega});moverStock(p.items,-1);
  guardar();aviso('Pedido actualizado');}
 else{
  const abono=aCent(fd.get('abono'));
  const p={id:uid(),clienteId,items:F.items,total,pagoPrevio:0,detalle,entrega,entregado:F.yaEntregado,fecha:hoy()};
  D.pedidos.push(p);moverStock(p.items,-1);
  if(abono>0)D.movs.push({id:uid(),tipo:'ing',concepto:(abono>=total?'Pago de ':'Abono de ')+(clienteId?cli(clienteId).nombre:'venta rápida'),cat:'Pago de pedido',monto:abono,fecha:hoy(),pedidoId:p.id});
  guardar();aviso(abono>total?'Guardado. Ojo: pagó más de lo que cuesta':'¡Pedido guardado!');
 }
 const faltan=F.items.filter(i=>{const pr=i.pid&&prod(i.pid);return pr&&!pr.encargo&&pr.stock<0});
 if(faltan.length)setTimeout(()=>aviso('Según el inventario no te alcanzaban: '+faltan.map(i=>i.nombre).join(', ')+'. Revisa el inventario.',true),2700);
}

  guardar();aviso(debe(p)>0?'Anotado. Todavía debe '+fmt(debe(p)):'¡Pagado completo!')}})}

function exportar(){
 D.copiaAt=hoy();guardar(true);
 const nombre='copia-miss-lacitoss-'+hoy()+'.json',blob=new Blob([JSON.stringify(D)],{type:'application/json'});
 const file=typeof File=='function'?new File([blob],nombre,{type:'application/json'}):null;

  navigator.share({files:[file],title:'Copia Miss Lacitoss'}).then(()=>aviso('Copia lista')).catch(()=>descargar(blob,nombre));

function descargar(blob,nombre){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);aviso('Copia guardada en Descargas')}
$('#archivo').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(err){return aviso('Ese archivo no es una copia de Miss Lacitoss',true)}
  if(!o||typeof o!='object'||!(o.v===2||Array.isArray(o.p)||Array.isArray(o.c)))return aviso('Ese archivo no es una copia de Miss Lacitoss',true);

   try{localStorage.setItem(KEY+'_antes_de_recuperar',JSON.stringify(D))}catch(err){}
   D=n;guardar();aviso('¡Copia recuperada!')},'c-cielo')};
 r.readAsText(f)});

/* =========================================================
   NUBE (Supabase): el teléfono guarda primero y luego sube.
   Si no hay internet, los cambios esperan en cola y suben solos.
   ========================================================= */
const CFG=window.ML_CONFIG||{};
const NUBE_ON=!!(CFG.supabaseUrl&&CFG.supabaseKey);
const LIB_SUPA='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const LIB_PDF=['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
const NKEY=KEY+'_nube',COLS=['productos','clientas','pedidos','movs'];
let sb=null,SES=null,N={uid:'',desde:'',ultimo:{},pend:{}},NE={error:'',subiendo:false};
const enNube=()=>NUBE_ON&&!!SES&&N.uid===SES.user.id;
const nPend=()=>Object.keys(N.pend).length;
function cargarScript(src){return new Promise((ok,mal)=>{if($$('script').some(x=>x.src==src&&x.dataset.ok))return ok();const s=document.createElement('script');s.src=src;s.onload=()=>{s.dataset.ok='1';ok()};s.onerror=()=>{s.remove();mal(new Error('sin conexión'))};document.head.appendChild(s)})}
/* JSON con llaves ordenadas: así la nube y el teléfono comparan igual */
function canon(o){if(Array.isArray(o))return'['+o.map(canon).join(',')+']';if(o&&typeof o=='object')return'{'+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o)}
function nubeLeer(){try{const o=JSON.parse(localStorage.getItem(NKEY)||'{}');N={uid:o.uid||'',desde:o.desde||'',ultimo:o.ultimo||{},pend:o.pend||{}}}catch(e){}}
function nubeEscribir(){try{localStorage.setItem(NKEY,JSON.stringify(N))}catch(e){}}
function foto(){const f={};COLS.forEach(c=>D[c].forEach(r=>f[c+':'+r.id]=canon(r)));f['ajustes:main']=canon({cats:D.cats});return f}
function marcarCambios(){
 if(!enNube())return;
 const f=foto();let n=0;
 for(const k in f)if(N.ultimo[k]!==f[k]){N.pend[k]=f[k];N.ultimo[k]=f[k];n++}
 for(const k in N.ultimo)if(!(k in f)){N.pend[k]=null;delete N.ultimo[k];n++}
 if(n){nubeEscribir();programarSubida();estadoNube()}
}
let tSubir;
function programarSubida(ms=1200){clearTimeout(tSubir);tSubir=setTimeout(subir,ms)}
async function subir(){
 if(!enNube()||NE.subiendo||!navigator.onLine)return estadoNube();
 const keys=Object.keys(N.pend);if(!keys.length)return estadoNube();
 NE.subiendo=true;estadoNube();
 const lote=keys.slice(0,300),env={};
 const filas=lote.map(k=>{const v=N.pend[k],i=k.indexOf(':');env[k]=v;return{coleccion:k.slice(0,i),id:k.slice(i+1),data:v?JSON.parse(v):{},borrado:v===null}});
 let ok=false;
 try{const{error}=await sb.from('registros').upsert(filas,{onConflict:'coleccion,id'});if(error)throw error;
  lote.forEach(k=>{if(N.pend[k]===env[k])delete N.pend[k]});NE.error='';nubeEscribir();ok=true}
 catch(e){NE.error=traducirError(e)}
 NE.subiendo=false;estadoNube();
 if(ok&&nPend())programarSubida(50);
}
async function bajar(){
 if(!enNube()||!navigator.onLine)return;
 let cambio=false;
 for(let vuelta=0;vuelta<50;vuelta++){
  let q=sb.from('registros').select('coleccion,id,data,borrado,actualizado').order('actualizado',{ascending:true}).limit(1000);
  if(N.desde)q=q.gte('actualizado',N.desde);
  const{data,error}=await q;
  if(error){NE.error=traducirError(error);break}
  NE.error='';
  for(const r of data){
   const k=r.coleccion+':'+r.id;
   if(!N.desde||r.actualizado>N.desde)N.desde=r.actualizado;
   if(k in N.pend)continue;                       /* lo de este teléfono manda: va a subir */
   const v=r.borrado?null:canon(r.data);
   if(r.coleccion=='ajustes'){if(v&&N.ultimo[k]!==v){D.cats=r.data.cats||D.cats;N.ultimo[k]=v;cambio=true}continue}
   if(!COLS.includes(r.coleccion))continue;
   const arr=D[r.coleccion],i=arr.findIndex(x=>x.id==r.id);
   if(v===null){if(i>-1){arr.splice(i,1);cambio=true}delete N.ultimo[k]}
   else if(N.ultimo[k]!==v||i<0){if(i>-1)arr[i]=r.data;else arr.push(r.data);N.ultimo[k]=v;cambio=true}
  }
  if(data.length<1000)break;
 }
 nubeEscribir();
 if(cambio){guardar(true);if($('#ov').hidden)pintar()}
 estadoNube();
}

const pdfTxt=s=>String(s??'').replace(/[−–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/[^\x00-\xFF]/g,'').trim();

async function nuevoPDF(titulo,sub){

function pdfEspacio(doc,h){if(doc._y+h>280){doc.addPage();doc._y=18}}
function pdfSeccion(doc,t){pdfEspacio(doc,22);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(27,20,25);doc.text(pdfTxt(t),14,doc._y);
 doc.setDrawColor(...COLR.rosa);doc.setLineWidth(.6);doc.setLineDashPattern([1.6,1.2],0);doc.line(14,doc._y+2.2,196,doc._y+2.2);doc.setLineDashPattern([],0);doc._y+=7}
function pdfKpis(doc,arr){const n=arr.length,g=4,w=(182-g*(n-1))/n,h=20;pdfEspacio(doc,h+4);
 arr.forEach(([l,v,col],i)=>{const x=14+i*(w+g);doc.setFillColor(...suave(COLR[col]||[200,200,200]));doc.roundedRect(x,doc._y,w,h,3,3,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(95,85,95);doc.text(pdfTxt(l).toUpperCase(),x+4,doc._y+6.5);
  doc.setFontSize(n>4?11:13);doc.setTextColor(27,20,25);doc.text(pdfTxt(v),x+4,doc._y+15)});

function pdfTabla(doc,head,body,opt={}){

 doc.autoTable({startY:doc._y,head:[head.map(pdfTxt)],body:body.map(r=>r.map(pdfTxt)),foot:opt.foot?[opt.foot.map(pdfTxt)]:undefined,
  margin:{left:14,right:14},theme:'plain',styles:{font:'helvetica',fontSize:9,cellPadding:{top:2.2,bottom:2.2,left:2.5,right:2.5},textColor:[40,30,40],lineColor:[235,225,232],lineWidth:{bottom:.2}},

  alternateRowStyles:{fillColor:[251,247,249]},columnStyles:opt.cols||{},showFoot:'lastPage'});

async function pdfEntregar(doc,nombre){
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(150,140,150);
  doc.text(`Miss Lacitoss · Generado el ${fe(hoy())} · Página ${i} de ${n}`,105,290,{align:'center'})}
 const blob=doc.output('blob'),file=typeof File=='function'?new File([blob],nombre,{type:'application/pdf'}):null;
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:nombre});return}catch(e){if(e&&e.name=='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);aviso('PDF guardado en Descargas');

function repCliElegir(){
 if(!D.clientas.length)return aviso('Todavía no tienes clientas anotadas',true);
 hoja('¿De qué clienta?',`<div class="res">${D.clientas.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<button type="button" data-a="repCli" data-id="${c.id}">${ic('clienta')}<span>${esc(c.nombre)}<small>${plural(D.pedidos.filter(p=>p.clienteId==c.id).length,'pedido','pedidos')}</small></span></button>`).join('')}</div>`,{sinBoton:true});
}

/* ---------- búsqueda sin perder el teclado ---------- */
function conBusqueda(sel,set){const i=$(sel);if(!i)return;
 i.addEventListener('input',()=>{set(i.value);const pos=i.selectionStart;pintar();const n=$(sel);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}})}

/* =========================================================
   ACCIONES (todos los botones)
   ========================================================= */
const A={
 tab:id=>irA(id),cerrar:()=>cerrar(),
 filtro:id=>{FILTRO=id;pintar()},
 verDeben:()=>{FILTRO='deben';BUSCA_P='';irA('pedidos')},
 verPedido:id=>{FILTRO='todos';BUSCA_P='';irA('pedidos');const el=$('#p-'+id);if(el)el.scrollIntoView({block:'center'})},
 verPedCli:id=>{BUSCA_P=cli(id).nombre;FILTRO='todos';irA('pedidos')},
 nuevoPedido:()=>formPedido(null),
 editPedido:id=>formPedido(ped(id)),
 cobrar:id=>cobrar(id),
 waPedido:id=>waPedido(id),
 entregar:id=>{const p=ped(id);p.entregado=!p.entregado;guardar();
  aviso(p.entregado?(debe(p)>0?'Entregado. Ojo: todavía debe '+fmt(debe(p)):'¡Entregado!'):'Marcado como por entregar')},
 borrarPedido:id=>{const p=ped(id),pagos=D.movs.filter(m=>m.pedidoId==id);
  preguntar(`Vas a borrar el pedido de <b>${esc(nomCli(p))}</b> (${fmt(p.total)}).${pagos.length?`<br><br>También se borran los ${plural(pagos.length,'pago','pagos')} que anotaste de este pedido.`:''}<br><br>Los productos vuelven al inventario.`,'Sí, borrar',()=>{
   moverStock(p.items,+1);D.pedidos=D.pedidos.filter(x=>x.id!=id);D.movs=D.movs.filter(m=>m.pedidoId!=id);guardar();aviso('Pedido borrado')})},
 pfCliSel:id=>{F.clienteId=id;F.nombre='';pfCli()},
 pfCliQuitar:()=>{F.clienteId='';pfCli();setTimeout(()=>$('#pf-nom')?.focus(),30)},
 pfAdd:id=>{const p=prod(id),ex=F.items.find(i=>i.pid==id);if(ex)ex.cant++;else F.items.push({pid:id,nombre:p.nombre,cant:1,precio:p.precio});pfItems()},
 pfAddCat:c=>{F.items.push({pid:'',nombre:c,cant:1,precio:0});pfItems();setTimeout(()=>$$('#pf-items [data-k=precio]').pop()?.focus(),30)},
 pfAddOtro:()=>{F.items.push({pid:'',nombre:'',cant:1,precio:0});pfItems();setTimeout(()=>$$('#pf-items [data-k=nombre]').pop()?.focus(),30)},
 pfQuitar:n=>{F.items.splice(+n,1);pfItems()},
 pfMas:n=>{F.items[+n].cant++;pfItems()},
 pfMenos:n=>{const i=F.items[+n];if(i.cant>1){i.cant--;pfItems()}},
 pfTodo:()=>{const i=$('#sf [name=abono]'),t=sum(F.items,x=>x.precio*x.cant);if(!t)return aviso('Primero toca los productos y su precio',true);
  i.value=centInput(t);i.dispatchEvent(new Event('input',{bubbles:true}))},
 pfEnt:(id,b)=>{F.yaEntregado=id=='1';$$('[data-a=pfEnt]').forEach(x=>x.classList.toggle('on',x==b))},
 editClienta:id=>editClienta(id),
 borrarClienta:id=>{const c=cli(id),n=D.pedidos.filter(p=>p.clienteId==id).length;
  if(n)return aviso(`${c.nombre} tiene ${plural(n,'pedido','pedidos')}. Bórralos primero si de verdad quieres borrarla.`,true);
  preguntar(`Vas a borrar a <b>${esc(c.nombre)}</b> y sus datos.`,'Sí, borrar',()=>{D.clientas=D.clientas.filter(x=>x.id!=id);guardar();aviso('Clienta borrada')})},
 editProd:id=>editProd(id),
 pcCat:c=>{PC.cat=PC.cat==c?'':c;pcCats();if(PC.cat=='__nueva')$('#pc-nueva').focus()},
 pcEnc:(id,b)=>{PC.enc=id=='1';$$('[data-a=pcEnc]').forEach(x=>x.classList.toggle('on',x==b));$('#pc-stock').hidden=PC.enc},
 stock:(id,b)=>{const p=prod(id),n=+b.dataset.n;if(n<0&&(p.stock||0)<=0)return;p.stock=(p.stock||0)+n;guardar()},
 llegaron:id=>llegaron(id),
 borrarProd:id=>{const p=prod(id);preguntar(`Vas a borrar <b>${esc(p.nombre)}</b> del inventario.<br><br>Los pedidos viejos no se borran.`,'Sí, borrar',()=>{D.productos=D.productos.filter(x=>x.id!=id);guardar();aviso('Producto borrado')})},
 mov:t=>formMov(t,null),
 editMov:id=>{const m=D.movs.find(x=>x.id==id);formMov(m.tipo,m)},
 mvCat:c=>{MV.cat=MV.cat==c?'':c;$$('#mv-cats .chip').forEach(x=>x.classList.toggle('on',x.dataset.id==MV.cat))},
 borrarMov:id=>{const m=D.movs.find(x=>x.id==id);
  preguntar(`Vas a borrar «${esc(m.concepto||m.cat)}» de ${fmt(m.monto)}.${m.pedidoId&&ped(m.pedidoId)?'<br><br>Como es un pago de un pedido, ese pedido volverá a deber este monto.':''}`,'Sí, borrar',()=>{D.movs=D.movs.filter(x=>x.id!=id);guardar();aviso('Borrado')})},
 mes:d=>{const[a,m]=MES.split('-').map(Number);const n=new Date(a,m-1+(+d),1);MES=n.getFullYear()+'-'+pad(n.getMonth()+1);pintar()},
 waCorte:()=>window.open('https://wa.me/?text='+encodeURIComponent(textoCorte()),'_blank'),
 exportar:()=>exportar(),
 importar:()=>$('#archivo').click(),
 nubeInfo:()=>nubeInfo(),
 nubeAhora:async()=>{await subir();await bajar();aviso(NE.error?NE.error:'Todo revisado',!!NE.error)},
 nubeElegir:(id,b)=>{$$('[data-a=nubeElegir]').forEach(x=>x.classList.toggle('on',x==b))},
 salir:()=>{if(nPend())return aviso('Espera: hay cambios sin subir. Conéctate a internet y espera a que diga Guardado.',true);
  preguntar('Vas a cerrar sesión en este teléfono. Tus datos siguen guardados en la nube.','Sí, cerrar sesión',()=>{sb.auth.signOut()},'c-coral')},
 repMes:()=>repMes(),repAnio:()=>repAnio(),repTodo:()=>repTodo(),
 repCli:id=>{if(!$('#ov').hidden)cerrar();repCli(id)},repCliElegir:()=>repCliElegir(),
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
 const f=A[b.dataset.a];if(!f)return;e.preventDefault();f(b.dataset.id,b,e)});

/* ---------- arranque ---------- */
cargar();irA('inicio');arrancarNube();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
